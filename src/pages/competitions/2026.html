<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Competitions | LognCoding</title>
    <!-- Favicons -->
    <link href="/src/assets/img/favicon.png" rel="icon" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/assets/css/style.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main class="relative min-h-[calc(100vh-188px)] overflow-x-clip">
      <div
        class="flex h-16 w-full items-end bg-[linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.7)),url(../../assets/img/splash-2.png)] bg-cover bg-center bg-no-repeat sm:h-40"></div>
      <div
        id="competitions-sub-menu"
        class="border-in sticky top-0 z-10 w-full border-b border-neutral-300/60 bg-white">
        <!-- insert competitions sub-menu -->
      </div>
      <div
        class="relative mx-auto mt-12 mb-28 flex size-full max-w-7xl flex-col items-center gap-12 px-4 md:mt-20 md:gap-14 lg:px-12">
        <div class="relative mx-auto w-full">
          <div class="border-b border-neutral-300/60">
            <ul
              class="-mb-px flex overflow-x-auto text-center font-medium"
              data-tabs-active-classes="text-flamingo-500 bg-flamingo-100/70"
              data-tabs-inactive-classes="text-zinc-500 hover:text-zinc-600 transition hover:border-neutral-300 hover:bg-zinc-200/50 border-transparent"
              id="default-tab"
              data-tabs-toggle="#default-tab-content"
              role="tablist">
              <li role="presentation">
                <button
                  class="text-flamingo-500 bg-flamingo-100/70 inline-flex cursor-pointer items-center gap-x-1 rounded-t-xs border-b p-2 text-xs text-nowrap sm:p-4 sm:text-base"
                  id="ai-tab"
                  data-tabs-target="#ai"
                  type="button"
                  role="tab"
                  aria-controls="ai"
                  aria-selected="true">
                  AI · Commputing
                </button>
              </li>
              <li role="presentation">
                <button
                  class="inline-flex cursor-pointer items-center gap-x-1 rounded-t-xs border-b border-transparent p-2 text-xs text-nowrap text-zinc-500 transition hover:border-neutral-300 hover:bg-zinc-200/50 hover:text-zinc-600 sm:p-4 sm:text-base"
                  id="steam-tab"
                  data-tabs-target="#steam"
                  type="button"
                  role="tab"
                  aria-controls="steam"
                  aria-selected="false">
                  Engineering · STEAM
                </button>
              </li>
            </ul>
          </div>
          <div id="default-tab-content">
            <div class="mt-6 space-y-6 rounded-xs" id="ai" role="tabpanel" aria-labelledby="ai-tab">
              <div class="w-full bg-black lg:bg-transparent">
                <img
                  src="/src/assets/img/contests/2026/1.webp"
                  class="mx-auto w-full max-w-7xl bg-black px-4 lg:px-12" />
              </div>
            </div>
            <div
              class="mt-6 hidden space-y-6 rounded-xs"
              id="steam"
              role="tabpanel"
              aria-labelledby="steam-tab">
              <div class="w-full bg-black lg:bg-transparent">
                <img
                  src="/src/assets/img/contests/2026/2.webp"
                  loading="lazy"
                  class="mx-auto w-full max-w-7xl bg-black px-4 lg:px-12" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- modals -->
    <!-- contact form -->
    <div
      id="contactForm"
      data-modal-backdrop="static"
      tabindex="-1"
      aria-hidden="true"
      class="fixed inset-0 top-0 left-0 z-50 hidden max-h-full w-full items-center justify-center">
      <div class="relative size-full max-h-full p-4 md:py-20">
        <!-- modal content -->
        <div
          class="relative mx-auto h-full w-full max-w-2xl rounded-xs bg-[#f6f6f6] py-4 shadow-lg">
          <button
            data-modal-hide="contactForm"
            class="bg-flamingo-500 hover-transition hover:bg-flamingo-400 hover:text-color-zinc-800 absolute top-4 right-3 inline-flex cursor-pointer rounded-full p-1 text-2xl shadow-sm hover:shadow-lg">
            <span class="heroicons--x-mark"></span>
          </button>
          <iframe
            class="size-full"
            src="https://docs.google.com/forms/d/e/1FAIpQLSc4P7lvKAG0YUQibGYe7MJofxm9v7eWRGDgLkNM2ZDdEZ9wbQ/viewform?embedded=true"
            frameborder="0"
            marginheight="0"
            marginwidth="0">
            Loading…
          </iframe>
        </div>
      </div>
    </div>

    <!-- floating buttons group -->
    <div class="group fixed right-6 bottom-6 z-50 flex flex-col items-end space-y-2">
      <!-- extra buttons: social + phone -->
      <div
        class="pointer-events-auto flex flex-col items-end space-y-2 opacity-100 transition-opacity duration-200">
        <!-- social channel -->
        <a
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="link--kakao inline-flex h-12 w-12 items-center justify-center overflow-hidden rounded-full shadow-lg transition">
          <img src="/src/assets/img/kakao.png" class="size-full object-cover" />
        </a>
        <!-- phone call -->
        <a
          href="tel:+8225401628"
          class="hover:bg-flamingo-500 active:bg-flamingo-500 inline-flex h-12 w-12 items-center justify-center rounded-full bg-white text-zinc-950 shadow-lg transition hover:text-white">
          <span class="heroicons--phone"></span>
        </a>
      </div>

      <!-- go-to-top -->
      <button
        id="goToTopBtn"
        class="hover:bg-flamingo-500 active:bg-flamingo-500 inline-flex h-12 w-12 items-center justify-center rounded-full bg-white text-zinc-950 shadow-lg transition hover:text-white">
        <span class="heroicons--arrow-long-up"></span>
      </button>
    </div>

    <footer
      class="relative w-full bg-zinc-950 bg-cover bg-center bg-no-repeat px-6 py-8 text-xs text-white sm:text-base lg:px-12">
      <div class="mx-auto w-full max-w-7xl space-y-4">
        <div class="flex flex-col justify-between gap-y-12 sm:flex-row-reverse">
          <div>
            <img
              src="/src/assets/img/logo_en_white.png"
              alt="LognCoding Logo"
              class="h-auto w-16 object-cover sm:w-24" />
          </div>
          <div class="flex flex-col gap-2 text-sm">
            <a
              href="https://drive.google.com/file/d/1AnsgXG8Z8UFZQThcVptzSbcZHL8KOKP1/view?usp=sharing"
              target="_blank">
              교습비 링크연결
            </a>
            <p>주소: 서울특별시 강남구 언주로174길 17 서우빌딩 3층</p>
            <p>대표번호: +82-2-540-1628</p>
            <p>학원 등록번호: 제14243호</p>
          </div>
        </div>
        <div class="flex flex-col justify-between gap-y-12 sm:flex-row">
          <div class="flex flex-col gap-6">
            <div class="flex gap-4">
              <a
                href="#"
                target="_blank"
                class="link--kakao flex size-8 items-center justify-between overflow-hidden rounded-lg">
                <img
                  src="/src/assets/img/kakao.png"
                  alt="kakao channel"
                  class="size-full object-cover" />
              </a>
              <a
                href="#"
                target="_blank"
                class="link--instagram flex size-8 items-center justify-between overflow-hidden rounded-lg">
                <img
                  src="/src/assets/img/instagram.png"
                  alt="Instagram"
                  class="size-full object-cover" />
              </a>
              <a
                href="#"
                target="_blank"
                class="link--youtube flex size-8 items-center justify-between overflow-hidden rounded-lg">
                <img src="/src/assets/img/youtube.png" alt="YouTube" class="object-cover" />
              </a>
              <a
                href="#"
                target="_blank"
                class="link--blog flex size-8 items-center justify-between overflow-hidden rounded-lg">
                <img
                  src="/src/assets/img/naver-blog.png"
                  alt="Naver Blog"
                  class="size-full object-cover" />
              </a>
            </div>
          </div>
          <p class="text-xs font-light text-zinc-500">
            Copyright 2023-2025 LognCoding. All Rights Reserved
          </p>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/assets/js/main.js"></script>
    <script type="module" src="/src/assets/js/competitions.js"></script>
    <script>
      kakaoPixel('3846674915067344801').pageView();
    </script>
  </body>
</html>
